<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f7f6; }
        .disclosure { font-size: 0.85rem; color: #666; font-style: italic; margin-bottom: 20px; border-left: 3px solid #ff9900; padding-left: 10px; }
        .product-card { background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 25px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .product-image { max-width: 100%; height: auto; border-radius: 4px; margin-bottom: 15px; }
        .product-title { font-size: 1.5rem; margin: 10px 0; color: #232f3e; }
        .product-description { font-size: 1rem; margin-bottom: 20px; color: #555; }
        .amazon-btn { background-color: #ff9900; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 50px; font-weight: bold; transition: background 0.3s ease; display: inline-block; }
        .amazon-btn:hover { background-color: #e68a00; }
        .badge { font-size: 0.75rem; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="disclosure">
        As an Amazon Associate, I earn from qualifying purchases.
    </div>

    <div class="product-card">
        <img src="https://via.placeholder.com/300x300?text=Product+Image" alt="Product Name" class="product-image">
        
        <h1 class="product-title">Product Name Here</h1>
        
        <p class="product-description">
            Briefly describe the key benefits and features of the product. Focus on why it’s useful for your audience.
        </p>

        <a href="#" target="_blank" rel="nofollow noopener" class="amazon-btn">
            Check Price on Amazon
        </a>

        <span class="badge">Paid Link</span>
    </div>

</body>
</html>
